<script>
const layoutBase = {
    margin: { l: 80, r: 80, t: 60, b: 80 }, // ~40% perceived padding width
    paper_bgcolor: 'rgba(0,0,0,0)',
    plot_bgcolor: 'rgba(0,0,0,0)',
    font: { color: '#0f2a44' }
};

document.getElementById('fileInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    const reader = new FileReader();

    reader.onload = function(event) {
        const rows = event.target.result.trim().split('\n').slice(1);
        const data = rows.map(r => r.split(','));

        const amount = data.map(d => +d[2]);
        const date = data.map(d => d[1]);
        const type = data.map(d => d[4]);
        const location = data.map(d => d[5]);
        const fraud = data.map(d => +d[6]);
        const merchant = data.map(d => d[3]);

        // 1. Fraud Distribution
        Plotly.newPlot('fraudPie', [{
            values: [
                fraud.filter(f => f === 0).length,
                fraud.filter(f => f === 1).length
            ],
            labels: ['Legitimate', 'Fraud'],
            hole: 0.45,
            type: 'pie'
        }], { ...layoutBase, title: 'Fraud vs Non-Fraud Transactions' });

        // 2. Fraud Trend Over Time
        Plotly.newPlot('fraudTrend', [{
            x: date.filter((_, i) => fraud[i] === 1),
            y: fraud.filter(f => f === 1),
            mode: 'lines+markers',
            type: 'scatter'
        }], { ...layoutBase, title: 'Fraud Trend Over Time' });

        // 3. Amount Distribution
        Plotly.newPlot('amountBox', [
            { y: amount.filter((_, i) => fraud[i] === 0), type: 'box', name: 'Legitimate' },
            { y: amount.filter((_, i) => fraud[i] === 1), type: 'box', name: 'Fraudulent' }
        ], { ...layoutBase, title: 'Transaction Amount Distribution' });

        // 4. Fraud by Transaction Type
        const typeCounts = {};
        type.forEach((t, i) => {
            if (fraud[i] === 1) typeCounts[t] = (typeCounts[t] || 0) + 1;
        });

        Plotly.newPlot('typeBar', [{
            x: Object.keys(typeCounts),
            y: Object.values(typeCounts),
            type: 'bar'
        }], { ...layoutBase, title: 'Fraud by Transaction Type' });

        // 5. Fraud by Location (Top 10)
        const locCounts = {};
        location.forEach((l, i) => {
            if (fraud[i] === 1) locCounts[l] = (locCounts[l] || 0) + 1;
        });

        const locSorted = Object.entries(locCounts).sort((a, b) => b[1] - a[1]).slice(0, 10);

        Plotly.newPlot('locationBar', [{
            x: locSorted.map(d => d[0]),
            y: locSorted.map(d => d[1]),
            type: 'bar'
        }], { ...layoutBase, title: 'Top Fraud Locations' });

        // 6. Fraud by Merchant (Top 10)
        const merCounts = {};
        merchant.forEach((m, i) => {
            if (fraud[i] === 1) merCounts[m] = (merCounts[m] || 0) + 1;
        });

        const merSorted = Object.entries(merCounts).sort((a, b) => b[1] - a[1]).slice(0, 10);

        Plotly.newPlot('merchantBar', [{
            x: merSorted.map(d => d[0]),
            y: merSorted.map(d => d[1]),
            type: 'bar'
        }], { ...layoutBase, title: 'Top Fraud Merchants' });

        // 7. Fraud Amount Contribution
        Plotly.newPlot('amountStack', [{
            x: ['Legitimate', 'Fraud'],
            y: [
                amount.filter((_, i) => fraud[i] === 0).reduce((a, b) => a + b, 0),
                amount.filter((_, i) => fraud[i] === 1).reduce((a, b) => a + b, 0)
            ],
            type: 'bar'
        }], { ...layoutBase, title: 'Total Amount: Fraud vs Legitimate' });
    };

    reader.readAsText(file);
});
